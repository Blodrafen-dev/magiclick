# MagiClick configuration
# Copy to ~/.config/magiclick/config.toml and edit.

# Rule 5. How long an arm survives. Long enough to browse with it: select the
# text, switch desktop or window, find the field, click. A paste only ever
# fires inside a real window, so a longer arm is not a longer risk.
arm_timeout_ms = 30000

# Device units of pointer travel before a press counts as selecting rather
# than a click. Raise it if short selections never arm.
drag_threshold = 40

# The confirm key. Bind your thumb button or foot pedal to this.
# Supported: KEY_F13, KEY_F14, KEY_F15, KEY_F16, KEY_PAUSE, KEY_SCROLLLOCK
confirm_key = "KEY_F13"

# "observe" logs what would have been pasted and types nothing. Start here.
# "paste" actually injects the chord below.
confirm_action = "observe"

# Injected when confirm_action = "paste".
# "auto" picks ctrl+v, or ctrl+shift+v in terminals, from the focused window.
# Set an explicit chord only to override that.
paste_chord = "auto"

# Copy selections to the clipboard automatically.
copy_on_drag = true

# Arm from a copy you clicked, not just a drag you made.
#
# A click with no drag that is followed by a clipboard change we did not make is
# a copy you asked for: a copy glyph on a web page, "Copy link address" in a
# context menu, a copy button in any app. Those never touch the selection, so
# without this they arm nothing.
#
# "click" enables it. "off" goes back to arming on drags only.
arm_on_copy = "click"

# How long after a click a copy still counts as caused by that click. Longer
# catches a slow context-menu choice; shorter is stricter about clicks that
# happened to be followed by some unrelated copy.
copy_click_window_ms = 600

# Refuse to carry anything larger than this. A 4MB blob is almost never
# something you meant to paste into an editable field.
max_bytes = 65536
