[package]
name = "magiclick"
version = "0.1.0"
edition = "2024"
description = "Copy on selection, paste where you click: a confirm-gated clipboard router for Linux"
license = "MIT"
repository = "https://github.com/Blodrafen-dev/magiclick"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
evdev = "0.13.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
